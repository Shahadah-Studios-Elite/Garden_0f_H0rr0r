<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden 0f H0RR0R 3D - Modular Stable Edition</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; font-family: 'Courier New', monospace; background-color: #0c0808; color: #ff3333; user-select: none; }
        #canvas-holder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #220505 0%, #050000 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; }
        #menu-screen h1 { font-size: 3.5rem; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 15px; text-shadow: 0 0 12px #ff0000; }
        #menu-screen p { color: #bbbbbb; font-size: 1.1rem; margin-bottom: 35px; max-width: 500px; line-height: 1.6; }
        .action-btn { padding: 16px 45px; font-size: 1.4rem; background: #440000; color: #ff4444; border: 3px solid #ff3333; cursor: pointer; text-transform: uppercase; font-weight: bold; box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); transition: 0.2s; }
        .action-btn:hover { background: #ff3333; color: #000000; box-shadow: 0 0 30px #ff3333; }
        #hud-overlay { position: absolute; top: 25px; left: 25px; font-size: 1.6rem; font-weight: bold; text-shadow: 2px 2px 5px #000000; pointer-events: none; z-index: 5; display: none; }
        #interaction-prompt { position: absolute; bottom: 25%; width: 100%; text-align: center; font-size: 1.8rem; color: #ffffff; text-shadow: 0 0 8px #ff0000; font-weight: bold; display: none; pointer-events: none; z-index: 5; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: rgba(255, 50, 50, 0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; display: none; box-shadow: 0 0 4px #000000; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="menu-screen">
        <h1>Garden 0f H0RR0R 3D</h1>
        <p>Find 5 Hidden Switch Posts. Approach them and press [E] to flip. Collect them all to unlock the Master Exit Door.</p>
        <button class="action-btn" id="launch-engine-btn">Click to Start Game</button>
    </div>
    <div id="hud-overlay">Switches Activated: <span id="counter">0</span> / 5</div>
    <div id="interaction-prompt">PRESS [E] TO INTERACT</div>
    <div id="crosshair"></div>
    <div id="canvas-holder"></div>
    <script src="js.js"></script>
</body>
</html>
