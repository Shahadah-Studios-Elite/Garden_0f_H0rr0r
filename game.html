<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden 0f H0RR0R 3D - Shahadah Studios Elite</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff0000;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
            z-index: 5;
            pointer-events: none;
        }
        #interaction-prompt {
            position: absolute;
            bottom: 25%;
            width: 100%;
            text-align: center;
            font-size: 2rem;
            color: #0000ff;
            background: rgba(255, 255, 255, 0.8);
            font-weight: bold;
            display: none;
            pointer-events: none;
            z-index: 5;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #ff0000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        #click-notice {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            font-size: 1.5rem;
            border-radius: 10px;
            z-index: 10;
            text-align: center;
        }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="click-notice">CLICK THE SCREEN TO UNLOCK MOUSE CONTROLS</div>
    <div id="hud">Switches Discovered: <span id="counter">0</span> / 5</div>
    <div id="interaction-prompt">Press [E] to Flip Switch</div>
    <div id="crosshair"></div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const counterEl = document.getElementById('counter');
        const promptEl = document.getElementById('interaction-prompt');
        const canvasEl = document.getElementById('gameCanvas');
        const noticeEl = document.getElementById('click-notice');

        let scene, camera, renderer, clock;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let direction = new THREE.Vector3();
        let isLocked = false;

        let switchesCount = 0;
        let interactiveObjects = [];
        let escapeDoor;

        const player = {
            yaw: 0,
            pitch: 0,
            speed: 0.2,
            height: 2
        };

        window.onload = () => {
            initGame();
            document.body.addEventListener('click', () => {
                document.body.requestPointerLock();
            });
        };

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === document.body;
            if (isLocked) {
                noticeEl.style.display = 'none';
            } else {
                noticeEl.style.display = 'block';
            }
        });

        document.addEventListener('mousemove', (event) => {
            if (!isLocked) return;
            
            player.yaw -= event.movementX * 0.003;
            player.pitch -= event.movementY * 0.003;
            player.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, player.pitch));

            camera.rotation.set(0, 0, 0);
            camera.rotateY(player.yaw);
            camera.rotateX(player.pitch);
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
            if (e.code === 'KeyE') checkInteraction();
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
        });

        function initGame() {
            clock = new THREE.Clock();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, player.height, 20);

            renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            buildMap();
            animate();
        }

        function buildMap() {
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 }); 
            const wallMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });  
            const doorMat = new THREE.MeshBasicMaterial({ color: 0x0000ff });  
            const pillarMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });

            const floorGeo = new THREE.PlaneGeometry(60, 60);
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const createWall = (w, h, d, x, y, z) => {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(x, y, z);
                scene.add(mesh);
            };

            createWall(60, 8, 1, 0, 4, -30); 
            createWall(60, 8, 1, 0, 4, 30);  
            createWall(1, 8, 60, -30, 4, 0); 
            createWall(1, 8, 60, 30, 4, 0);  

            const pillarGeo = new THREE.BoxGeometry(4, 8, 4);
            const pillarPositions = [{x: -12, z: -8}, {x: 12, z: -8}, {x: -12, z: 12}, {x: 12, z: 12}];
            pillarPositions.forEach(pos => {
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(pos.x, 4, pos.z);
                scene.add(pillar);
            });

            const switchBoxGeo = new THREE.BoxGeometry(1, 1.5, 1);
            const switchPositions = [
                { x: -15, z: -15 }, { x: 18, z: -20 },
                { x: -22, z: 12 }, { x: 20, z: 18 }, { x: 2, z: 10 }
            ];

            switchPositions.forEach((pos, idx) => {
                const mesh = new THREE.Mesh(switchBoxGeo, new THREE.MeshBasicMaterial({ color: 0xff00ff }));
                mesh.position.set(pos.x, 1.5, pos.z);
                mesh.userData = { id: idx, active: false };
                scene.add(mesh);
                interactiveObjects.push(mesh);
            });

            const doorGeo = new THREE.BoxGeometry(6, 6, 1);
            escapeDoor = new THREE.Mesh(doorGeo, doorMat);
            escapeDoor.position.set(0, 3, -29);
            scene.add(escapeDoor);
        }

        function checkInteraction() {
            interactiveObjects.forEach((obj) => {
                let dist = camera.position.distanceTo(obj.position);
                if (dist < 5.0 && !obj.userData.active) {
                    obj.userData.active = true;
                    obj.material.color.setHex(0x00ffff); 

                    switchesCount++;
                    counterEl.innerText = switchesCount;

                    if (switchesCount < 5) {
                        escapeDoor.position.x += 2.0; 
                    } else {
                        escapeDoor.position.y += 10.0; 
                        setTimeout(() => {
                            alert("YOU ESCAPED THE BRIGHT GARDEN!");
                            document.exitPointerLock();
                        }, 200);
                    }
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isLocked) {
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) camera.translateZ(-direction.z * player.speed);
                if (moveLeft || moveRight) camera.translateX(direction.x * player.speed);
            }

            camera.position.y = player.height;

            let showPrompt = false;
            interactiveObjects.forEach((obj) => {
                let dist = camera.position.distanceTo(obj.position);
                if (dist < 5.0 && !obj.userData.active) {
                    showPrompt = true;
                }
            });
            promptEl.style.display = showPrompt ? 'block' : 'none';

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
